# Render Blueprint for Kottab Discovery Engine.
# The API key is NOT in this file: Render asks for it when the Blueprint is created (sync: false).
services:
  - type: web
    name: kottab-discovery-engine
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # Lasting disk for generated episodes and the referral log (DATA_STORE_DIR below).
    disk:
      name: kottab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Reviewer page PIN; given to the judges in the submission file, never in the repository.
      - key: REVIEWER_PIN
        sync: false
      # "auto" (default) or "review-first" (every episode waits for the teacher, e.g. for a trial with a real child).
      - key: PUBLISH_MODE
        sync: false
      - key: DATA_STORE_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: GENERATIONS_PER_IP_PER_HOUR
        value: "6"
      - key: GENERATIONS_PER_DAY
        value: "80"
      - key: QUESTIONS_PER_IP_PER_HOUR
        value: "30"
      - key: QUESTIONS_PER_DAY
        value: "400"
